name: Test

on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
      - 'terraform/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'functions/**'
      - 'terraform/**'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9]
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          DEBUG: "1"
          DOCKER_HOST: "unix:///var/run/docker.sock"
          LAMBDA_EXECUTOR: "docker"
          PERSISTENCE: "1"
          SERVICES: "lambda,sns"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov boto3 botocore moto
          if [ -f functions/requirements.txt ]; then pip install -r functions/requirements.txt; fi

      - name: Run unit tests
        working-directory: functions
        run: |
          pytest test_lambda_function.py -v --cov=lambda_function --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./functions/coverage.xml
          working-directory: functions
          flags: python-tests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: Set up AWS CLI
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2

      - name: Build Lambda package
        working-directory: functions
        run: |
          mkdir -p package
          cp lambda_function.py package/
          pip install -r requirements.txt -t package/
          cd package && zip -r ../function.zip .

      - name: Create SNS topic
        run: |
          aws --endpoint-url=http://localhost:4566 sns create-topic --name cloudwatch-notifier-topic

      - name: Create Lambda function
        run: |
          aws --endpoint-url=http://localhost:4566 lambda create-function \
            --function-name cloudwatch-notifier \
            --runtime python${{ matrix.python-version }} \
            --handler lambda_function.lambda_handler \
            --zip-file fileb://functions/function.zip \
            --role arn:aws:iam::000000000000:role/lambda-role \
            --environment "Variables={SNS_ARN=arn:aws:sns:us-east-1:000000000000:cloudwatch-notifier-topic,AWS_REGION=us-east-1}"

      - name: Create test event
        run: |
          echo '{"awslogs":{"data":"'$(echo '{"logGroup":"/aws/lambda/test-function","logStream":"2024/01/01/[$LATEST]1234567890","logEvents":[{"message":"{\"log\":\"test error\",\"kubernetes\":{\"pod_name\":\"test-pod\",\"namespace_name\":\"test-namespace\",\"container_name\":\"test-app\"}}"}]}' | base64)'"}}' > test-event.json

      - name: Invoke Lambda function
        run: |
          aws --endpoint-url=http://localhost:4566 lambda invoke \
            --function-name cloudwatch-notifier \
            --payload file://test-event.json \
            output.json
          cat output.json 
